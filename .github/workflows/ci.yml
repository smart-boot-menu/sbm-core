name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sbm-core
      - uses: actions/checkout@v4
        with:
          repository: smart-boot-menu/sbm-common
          ref: 28d38450954f0b93815e12f31da92370b13a7462
          path: sbm-common
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check
        working-directory: sbm-core
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace
