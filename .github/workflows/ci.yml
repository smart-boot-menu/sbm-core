name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sbm-core
      - uses: actions/checkout@v4
        with:
          repository: smart-boot-menu/sbm-common
          ref: abe3029c831f05d77d10cfb214a0c236903d00d9
          path: sbm-common
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check
        working-directory: sbm-core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
