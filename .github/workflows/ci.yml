name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sbm-core
      - uses: actions/checkout@v4
        with:
          repository: smart-boot-menu/sbm-common
          ref: b3c77141504be71bfad6602d8df628f84f704c7b
          path: sbm-common
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check
        working-directory: sbm-core
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked --workspace
