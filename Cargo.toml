[workspace]
resolver = "3"
members = [
    "crates/sbm-runtime",
    "crates/sbm-cored",
    "crates/sbm-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
sbm-protocol = { path = "../sbm-common/crates/sbm-protocol" }
sbm-types = { path = "../sbm-common/crates/sbm-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
iced = "0.14"
