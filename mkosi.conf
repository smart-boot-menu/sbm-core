# SBM Core 0.1 image. Architecture packages live in mkosi.conf.d.
# Do not select the aarch64-apple profile. See docs/ARCHITECTURE_VALIDATION.md.

[Distribution]
Distribution=fedora
Release=45

[Output]
Format=disk
Output=sbm-core-%a
ImageId=sbm-core
CompressOutput=no
OutputDirectory=build/images
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=uki
ShimBootloader=none
BiosBootloader=none
KernelCommandLine=console=tty0 console=ttyS0,115200 console=ttyAMA0,115200 systemd.volatile=overlay sbm.toram=auto sbm.slot=slot-a selinux=0
KernelInitrdModules=default
        erofs
        loop
        virtio_blk
        virtio_pci
        virtio_scsi
        virtio_net
        virtio_gpu
        nvme
        ahci
        sd_mod
        usb_storage
        xhci_pci
        xhci_hcd
WithRecommends=no
WithDocs=no
SELinuxRelabel=no
Autologin=no
Ssh=never
Hostname=sbm-core
Timezone=UTC
Locale=C.UTF-8
LocaleMessages=C.UTF-8
Keymap=us
SourceDateEpoch=1795651200
Packages=
        systemd
        dbus
        dbus-broker
        polkit
        bash
        coreutils
        util-linux
        kmod
        shadow-utils
        procps-ng
        psmisc
        less
        grep
        sed
        gawk
        findutils
        which
        ca-certificates
        pciutils
        usbutils
        iproute
        ethtool
        iwd
        vim-minimal
        erofs-utils
        e2fsprogs
        dosfstools
        ntfs-3g
        ntfsprogs
        exfatprogs
        cryptsetup
        btrfs-progs
        parted
        gparted
        partclone
        testdisk
        ddrescue
        smartmontools
        nvme-cli
        efibootmgr
        rsync
        openssh-server
        openssh-clients
        wimlib-utils
        labwc
        xorg-x11-server-Xwayland
        xhost
        xorg-x11-xauth
        fontconfig
        dejavu-sans-fonts
        adwaita-icon-theme
        foot
        mesa-dri-drivers
        mesa-vulkan-drivers
        mesa-libEGL
        mesa-libGL
        vulkan-loader
        wayvnc
        linux-firmware-whence
        amd-gpu-firmware
        intel-gpu-firmware
        iwlwifi-dvm-firmware
        iwlwifi-mvm-firmware
        iwlwifi-mld-firmware
        iwlbluetooth-firmware
        atheros-firmware
        brcmfmac-firmware
        mt7xxx-firmware
        realtek-firmware

[Validation]
SecureBoot=yes
SecureBootAutoEnroll=no
SignExpectedPcr=no
Checksum=no

[Build]
CacheDirectory=build/mkosi-cache
PackageCacheDirectory=build/mkosi-pkgcache
BuildDirectory=build/mkosi-build
Incremental=no
