# Not built. Fedora 45 repos visible to the generic cloud image on 2026-11-26
# contained asahi-scripts and did not contain kernel-16k. Do not pass
# --profile=aarch64-apple, and do not treat this file as M5 support.
# Generic ARM64 images stay on the 4K kernel-core packages.

[Match]
Architecture=arm64

[Content]
Packages=
        kernel-16k
        kernel-16k-core
        kernel-16k-modules
        kernel-16k-modules-core
        asahi-scripts
RemovePackages=
        kernel-core
        kernel-modules
        kernel-modules-core
